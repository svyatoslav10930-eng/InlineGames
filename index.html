<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>КНБ</title>
</head>
<body>
    <h1>Камень-Ножницы-Бумага</h1>
    <p id="status">Загрузка...</p>
    <div id="buttons" style="display:none">
        <button onclick="sendChoice('rock')">🪨 Камень</button>
        <button onclick="sendChoice('scissors')">✂️ Ножницы</button>
        <button onclick="sendChoice('paper')">📄 Бумага</button>
    </div>
    <p id="result" style="display:none">Выбрано! Отправляем...</p>
    <script>
        function init() {
            if (window.Telegram && window.Telegram.WebApp) {
                window.Telegram.WebApp.ready();
                window.Telegram.WebApp.expand();
                document.getElementById('status').textContent = 'Выбери жест:';
                document.getElementById('buttons').style.display = 'block';
            } else {
                document.getElementById('status').textContent = 'Ошибка: не удалось инициализировать WebApp';
            }
        }
        function sendChoice(choice) {
            document.getElementById('status').textContent = 'Выбрано!';
            document.getElementById('buttons').style.display = 'none';
            document.getElementById('result').style.display = 'block';
            if (window.Telegram && window.Telegram.WebApp) {
                window.Telegram.WebApp.sendData(JSON.stringify({choice: choice}));
            }
        }
        window.addEventListener('load', init);
    </script>
</body>
</html>
